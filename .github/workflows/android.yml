
name: Build TC Lab Android APK
on:
  push:
    branches:
      - main
      - feature/protocol-workspace
  workflow_dispatch:

  

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK Platform 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android project
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Install TC Lab starter data
        run: |
          test -f tc-lab-data-bundle.zip
          unzip -o tc-lab-data-bundle.zip -d .
          test -f app/src/main/assets/database/seed_catalog.json
          test -f app/src/main/assets/database/research_sources.json
          test -f app/src/main/assets/database/equipment_catalog.json
          test -f app/src/main/assets/database/calculator_catalog.json
          test -f app/src/main/assets/database/learning_modules.json

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tc-lab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
